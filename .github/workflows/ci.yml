name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv venv --python 3.12 && uv pip install -e '.[dev]'
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/mypy src
      # The sheets are private, so source-based tests and the gate run locally only.
      - run: .venv/bin/python -m pytest -q tests/test_units.py tests/test_gate.py
