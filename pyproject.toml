[project]
name = "muse"
version = "0"
requires-python = ">=3.14"
dependencies = ["mido>=1.3.3", "pymupdf>=2.2", "psutil>=7.2.2"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[tool.pytest.ini_options]
markers = [
  "musescore: drives MuseScore itself; planted-bug controls run these only when they plant in code MuseScore runs",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.typos.default.extend-words]
tuplets = "tuplets"
